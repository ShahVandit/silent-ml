# debug-gym LLM config for a locally served model.
# Point --llm-config at this file: the key is what you pass to --model.
#
# The `vllm` tag selects debug-gym's HuggingFaceLLM, which counts tokens with the
# model's own tokenizer instead of tiktoken. The tag name refers to the tokenizer
# path, not the server - HuggingFaceLLM subclasses OpenAILLM, so it speaks to any
# OpenAI-compatible endpoint, Ollama included. Exact counts matter because they
# decide when the conversation history gets truncated.
qwen3-coder:
  model: qwen3-coder:30b                          # the tag Ollama serves
  tokenizer: Qwen/Qwen3-Coder-30B-A3B-Instruct    # downloaded once from HF
  tags: [vllm]
  endpoint: "http://localhost:11434/v1"
  api_key: "ollama"               # Ollama ignores it, but the client requires one
  context_limit: 32               # thousands of tokens
  generate_kwargs:
    temperature: 0.0

# Same model served by vLLM. Prefer this over Ollama for agent work: Ollama
# silently ignores tool_choice="required", so the model is free to answer in
# prose instead of calling a tool, and a benchmark then measures tool-calling
# compliance rather than task ability. vLLM enforces it.
qwen3-coder-vllm:
  model: Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8   # must match the served id
  tokenizer: Qwen/Qwen3-Coder-30B-A3B-Instruct
  tags: [vllm]
  endpoint: "http://localhost:8010/v1"
  api_key: "vllm"
  context_limit: 32
  generate_kwargs:
    temperature: 0.0
